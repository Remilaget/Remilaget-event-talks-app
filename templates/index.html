<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigQuery Release Notes Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header / Top Bar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h8" />
            <circle cx="18" cy="18" r="3" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">BigQuery Release Notes</h1>
          <p class="brand-subtitle">Live Atom Feed &bull; docs.cloud.google.com</p>
        </div>
      </div>

      <div class="nav-actions">
        <span id="last-updated-text" class="status-indicator">Checking feed...</span>
        <button id="refresh-btn" class="btn btn-primary" title="Refresh Feed">
          <svg id="refresh-icon" class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          <span id="refresh-spinner" class="spinner hidden"></span>
          <span id="refresh-label">Refresh Notes</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="container">
    <!-- Filter & Toolbar -->
    <section class="toolbar-card">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search release notes by keywords (e.g. SQL, Graph, GA, pipeline)..." autocomplete="off" />
        <button id="clear-search-btn" class="clear-btn hidden" title="Clear search">&times;</button>
      </div>

      <div class="filter-pills" id="filter-pills">
        <button class="pill active" data-filter="all">All Updates</button>
        <button class="pill" data-filter="Feature">Features</button>
        <button class="pill" data-filter="Breaking">Breaking</button>
        <button class="pill" data-filter="Change">Changes</button>
        <button class="pill" data-filter="Announcement">Announcements</button>
      </div>
    </section>

    <!-- Selection Tweet Banner (floating / active bar) -->
    <div id="selection-banner" class="selection-banner hidden">
      <div class="selection-info">
        <span class="selection-badge">Selected for X / Tweet</span>
        <span id="selected-summary" class="selected-text-preview"></span>
      </div>
      <div class="selection-actions">
        <button id="banner-tweet-btn" class="btn btn-tweet">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          Compose Tweet
        </button>
        <button id="clear-selection-btn" class="btn btn-secondary" title="Clear selection">Deselect</button>
      </div>
    </div>

    <!-- Feed Content Stream -->
    <div id="feed-container" class="feed-container">
      <!-- Loading skeleton will be rendered dynamically -->
      <div class="loading-state">
        <div class="spinner-large"></div>
        <p>Fetching BigQuery release notes...</p>
      </div>
    </div>
  </main>

  <!-- Tweet Composition Modal -->
  <div id="tweet-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="x-icon-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </div>
          <h2 id="modal-title">Post to X (Twitter)</h2>
        </div>
        <button id="close-modal-btn" class="close-btn" aria-label="Close modal">&times;</button>
      </div>

      <div class="modal-body">
        <label for="tweet-textarea" class="modal-label">Customize your tweet text:</label>
        <textarea id="tweet-textarea" rows="6" maxlength="280"></textarea>
        
        <div class="tweet-meta">
          <span id="char-counter" class="char-counter">280</span>
          <span class="tweet-hint">Includes link to BigQuery release note</span>
        </div>

        <div class="tweet-options">
          <label class="checkbox-label">
            <input type="checkbox" id="include-link-check" checked> Include official release note URL
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button id="copy-tweet-btn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copy-btn-text">Copy text</span>
        </button>
        <button id="publish-tweet-btn" class="btn btn-tweet-primary">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          Tweet on X
        </button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <p>Powered by Flask &bull; Feed: <a href="https://docs.cloud.google.com/feeds/bigquery-release-notes.xml" target="_blank" rel="noopener">BigQuery Atom Feed</a> &bull; Ready to Tweet</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
